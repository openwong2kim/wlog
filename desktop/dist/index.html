<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>wlog</title>
    <style>
      :root { color-scheme: light dark; }
      html, body {
        height: 100%;
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #141414;
        color: #e8e8e8;
      }
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
      }
      .brand {
        font-family: ui-monospace, Menlo, Consolas, monospace;
        font-weight: 600;
        font-size: 18px;
        letter-spacing: 0.04em;
      }
      .msg { font-size: 13px; color: #a0a0a0; }
      .spinner {
        width: 22px; height: 22px;
        border: 2px solid #3a3a3a;
        border-top-color: #5b8def;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <!-- Loading screen only. The Rust side (main.rs) waits for the wlog sidecar's
         HTTP port to open, then navigates this window to http://127.0.0.1:8899.
         We do NOT fetch/redirect from here: the WebView origin (tauri.localhost)
         is cross-origin to the server and would be blocked by CORS. -->
    <div class="wrap">
      <div class="brand">wlog</div>
      <div class="spinner"></div>
      <div class="msg">서버를 시작하는 중…</div>
    </div>
  </body>
</html>
