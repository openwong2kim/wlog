# GoReleaser v2 configuration for wlog.
# Single static binary (CGO disabled, pure-Go SQLite) with the embedded web UI.
# The UI (internal/web/dist) is committed, so GoReleaser does NOT rebuild it —
# rebuilding would change the hashed asset filenames and dirty the working tree,
# which fails GoReleaser's release-mode clean check. Rebuild + commit dist before
# tagging a release (CI builds the UI for tests; see .github/workflows/ci.yml).
# Docs: https://goreleaser.com
version: 2

project_name: wlog

before:
  hooks:
    - go mod download

builds:
  - id: wlog
    main: ./cmd/wlog
    binary: wlog
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/openwong2kim/wlog/internal/version.Version={{.Version}}
      - -X github.com/openwong2kim/wlog/internal/version.Commit={{.Commit}}
      - -X github.com/openwong2kim/wlog/internal/version.Date={{.Date}}

archives:
  - id: wlog
    ids:
      - wlog
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    # tar.gz everywhere, zip on Windows.
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

# Software Bill of Materials generated with syft for each archive.
sboms:
  - id: archive
    artifacts: archive

# Homebrew tap + Scoop bucket. They publish to SEPARATE repos, which the default
# Actions GITHUB_TOKEN cannot push to, so they authenticate with a PAT exposed as
# GH_PAT (wired in .github/workflows/release.yml). When GH_PAT is absent (e.g.
# before the secret is added) skip_upload evaluates to true, so the release still
# succeeds — the formula/manifest is generated locally but not pushed. Add the
# GH_PAT secret + re-run a release to activate one-line installs.
homebrew_casks:
  - name: wlog
    binaries:
      - wlog
    repository:
      owner: openwong2kim
      name: homebrew-tap
      branch: main
      token: '{{ .Env.GH_PAT }}'
    homepage: 'https://github.com/openwong2kim/wlog'
    description: 'Local observability for Claude Code in a single binary'
    skip_upload: '{{ if .Env.GH_PAT }}false{{ else }}true{{ end }}'
    commit_author:
      name: goreleaser-bot
      email: goreleaser@users.noreply.github.com
    # The binary is unsigned/unnotarized; strip the quarantine bit on install so
    # macOS Gatekeeper doesn't flag it as "damaged".
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/wlog"]
          end

scoops:
  - name: wlog
    repository:
      owner: openwong2kim
      name: scoop-bucket
      branch: main
      token: '{{ .Env.GH_PAT }}'
    homepage: 'https://github.com/openwong2kim/wlog'
    description: 'Local observability for Claude Code in a single binary'
    license: MIT
    skip_upload: '{{ if .Env.GH_PAT }}false{{ else }}true{{ end }}'
    commit_author:
      name: goreleaser-bot
      email: goreleaser@users.noreply.github.com

snapshot:
  version_template: '{{ incpatch .Version }}-next'

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'
      - 'Merge pull request'
      - 'Merge branch'
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Others
      order: 999

release:
  github:
    owner: openwong2kim
    name: wlog
  draft: false
  prerelease: auto
  name_template: 'wlog {{ .Tag }}'
  header: |
    **Local Claude Code observability in a single binary.**

    Tokens, cost, and tool decisions from your Claude Code sessions — zero-config
    from `~/.claude/projects`, optional OTLP for live updates, and an embedded web
    UI. Six screens including a GitHub-style **Daily** usage heatmap and a shared
    period filter across views.

    ### Install
    - `go install github.com/openwong2kim/wlog/cmd/wlog@latest`
    - Or download a prebuilt archive below (linux / macOS / windows · amd64 / arm64)
      and verify it against `checksums.txt`.
