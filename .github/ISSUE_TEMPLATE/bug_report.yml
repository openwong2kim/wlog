name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `wlog ...`
        2. Open the ... screen
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: wlog version
      description: Output of `wlog version`.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Data source
      description: Where is the data coming from?
      options:
        - Transcript JSONL (zero-config)
        - OTLP (telemetry enabled)
        - Both
        - Not sure
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Paste any relevant terminal output or screenshots.
