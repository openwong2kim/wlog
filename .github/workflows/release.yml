name: release

# Cuts a multi-platform release whenever a v* tag is pushed: GoReleaser builds
# the static binary for linux/darwin/windows × amd64/arm64 (embedding the
# committed UI), archives them (tar.gz / zip on Windows), and publishes the
# GitHub release with checksums.txt and a syft SBOM.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      # syft powers the SBOM step in .goreleaser.yaml; it is not bundled with
      # the goreleaser action, so install it onto PATH first.
      - name: Install syft (SBOM)
        uses: anchore/sbom-action/download-syft@v0

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
